name: Windows tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tools/audit-web-layout.cjs
      - run: npm run test:web
      - run: npx playwright install chromium
      - run: npm run test:web:browser
        env:
          SKIN_BROWSER_CHANNEL: chromium
      - run: npm run build:native
      - run: npm test
