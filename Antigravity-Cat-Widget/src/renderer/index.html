<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file:; media-src 'self' file:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'"><title>喵言喵语</title><link rel="stylesheet" href="../../assets/motions/gemini-widget.css"><link rel="stylesheet" href="widget.css"></head>
<body><main id="widget"><div class="agy-art" id="mascot" data-state="idle"><section class="agy-bubble interactive" id="bubble" role="status" aria-live="polite">
<div class="agy-bubble__title"><span id="title">Gemini Models</span><button id="close" aria-label="收起气泡">×</button></div>
<div id="quota" class="agy-quota"><div id="model-tag" class="agy-model-tag" hidden></div><div class="quota-label"><span>5 小时</span><strong id="percent">—</strong></div><div class="quota-reset" id="reset-5h"></div><div class="agy-quota__track" id="track" role="progressbar" aria-label="五小时剩余额度" aria-valuemin="0" aria-valuemax="100"><span class="agy-quota__fill" id="fill"></span></div><div class="quota-label"><span>1 周</span><strong id="percent-week">—</strong></div><div class="quota-reset" id="reset-week"></div><div class="agy-quota__track" id="track-week" role="progressbar" aria-label="一周剩余额度" aria-valuemin="0" aria-valuemax="100"><span class="agy-quota__fill" id="fill-week"></span></div><div id="caption" class="agy-quota__caption"></div></div>
<div id="value" class="agy-bubble__value" hidden></div><div id="detail" hidden></div><div class="agy-bubble__meta" id="meta">本机只读 · 不估算账户余额</div>
<nav class="bubble-nav"><button id="prev" aria-label="上一页">‹</button><span id="page">1 / 4</span><button id="next" aria-label="下一页">›</button></nav></section>
<div class="widget-tools interactive"><button id="toggle" aria-label="显示气泡">•••</button><button id="settings" aria-label="打开设置">☰</button></div>
<div class="agy-motion interactive" id="motion" tabindex="0" role="button" aria-label="猫娘，点击互动或拖动移动"><div class="agy-face">
<img class="agy-frame agy-frame--idle" src="../../assets/character-packs/gemini-star-v1/frames/idle.png" alt="Gemini 猫娘" draggable="false">
<img class="agy-expression agy-expression--proud" src="../../assets/character-packs/gemini-star-v1/frames/proud-v3.png" alt="" draggable="false">
<img class="agy-expression agy-expression--crying" src="../../assets/character-packs/gemini-star-v1/frames/sad-v3.png" alt="" draggable="false">
<img class="agy-expression agy-expression--shy" src="../../assets/character-packs/gemini-star-v1/frames/shy.png" alt="" draggable="false">
<img class="agy-expression agy-expression--angry" src="../../assets/character-packs/gemini-star-v1/frames/angry.png" alt="" draggable="false">
<img class="agy-effect agy-effect--thinking" src="../../assets/ui/effects/thinking-dots.svg" alt="">
<img class="agy-effect agy-effect--sparkle" src="../../assets/ui/effects/sparkle.svg" alt="">
<img class="agy-effect agy-effect--tear" src="../../assets/ui/effects/teardrop.svg" alt="">
<img class="agy-effect agy-effect--heart" src="../../assets/ui/effects/heart.svg" alt=""></div></div></div></main><script src="personality.js"></script><script src="renderer.cjs"></script></body></html>
