<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>星语喵伴 · Companion Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <img src="../assets/icons/icon-48.png" class="header-logo" alt="Logo">
      <div class="header-info">
        <h1 class="header-title">星语喵伴 · Settings</h1>
        <p class="header-subtitle">Gemini Web Companion · 基米乃桌宠</p>
      </div>
    </div>

    <div class="section-group">
      <div class="setting-item">
        <div class="label-box">
          <span class="setting-label">桌宠挂件显示</span>
          <span class="setting-sub">Desktop Pet Widget</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="chk-widget" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-item">
        <div class="label-box">
          <span class="setting-label">星空毛玻璃壁纸 (Dream Skin)</span>
          <span class="setting-sub">Frosted Glass Wallpaper</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="chk-skin" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-item">
        <div class="label-box">
          <span class="setting-label">点击交互音效</span>
          <span class="setting-sub">Sound Effects</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="chk-sound">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="section-group">
      <div class="setting-item vertical">
        <span class="setting-label">角色形象选择 / Character Pack</span>
        <div class="radio-cards">
          <label class="radio-card">
            <input type="radio" name="character" value="gemini-star-v1" checked>
            <div class="radio-content">
              <span class="card-title">Gemini 蓝紫星语</span>
              <span class="card-desc">四芒星空礼装 · 原版基米乃</span>
            </div>
          </label>
          <label class="radio-card">
            <input type="radio" name="character" value="lin-cat">
            <div class="radio-content">
              <span class="card-title">林猫居家水母头</span>
              <span class="card-desc">彩虹全息冲锋衣 · 水母双马尾</span>
            </div>
          </label>
        </div>
      </div>
    </div>

    <div class="section-group">
      <div class="setting-item vertical">
        <div class="slider-header">
          <span class="setting-label">挂件大小 / Widget Scale</span>
          <span class="slider-value" id="val-scale">200px</span>
        </div>
        <input type="range" id="range-scale" min="150" max="320" step="10" value="200" class="styled-slider">
      </div>

      <div class="setting-item vertical">
        <div class="slider-header">
          <span class="setting-label">Argon 单会话建议安全轮数</span>
          <span class="slider-value" id="val-turns">8 轮</span>
        </div>
        <input type="range" id="range-turns" min="3" max="20" step="1" value="8" class="styled-slider">
      </div>
    </div>

    <div class="btn-group">
      <button id="btn-reset-pos" class="btn-secondary">复位至右下角 / Reset Pos</button>
      <button id="btn-refresh" class="btn-primary">刷新页面 / Reload</button>
    </div>

    <div class="popup-footer">
      <span>100% Client-Side · MIT License · Antigravity Star Suite</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
